<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If-Else</title>
</head>
<body>
    {% if data %} 
        Value in data is :- {{ data }}
    {% else %}
        Data is Empty!!!
    {% endif %}
</body>
